<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Invigil dashboard: passive detection of hidden devices in exam halls</title>
    <meta
      name="description"
      content="Invigil finds hidden phones, Bluetooth earpieces and smartwatches in an exam hall by listening to the 2.4 GHz band. See the live hall map, alerts and unit health."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Invigil" />
    <meta property="og:title" content="Invigil dashboard" />
    <meta
      property="og:description"
      content="Passive detection of hidden phones, Bluetooth earpieces and smartwatches in exam halls. Every signal leaves a trace."
    />
    <meta property="og:url" content="https://demo.invigil.xyz/" />
    <meta property="og:image" content="https://demo.invigil.xyz/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Invigil logo and the tagline Every signal leaves a trace, with the near, mid and far bands." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Set the theme before the first paint. Dark unless the user picked otherwise.
      try {
        var theme = localStorage.getItem("invigil-theme") || "dark"
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
