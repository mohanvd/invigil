# Mosquitto config for the real sensor unit on the LAN.
# Run from the repo root so the relative password_file path resolves:
#   mosquitto -c server/mosquitto.conf -v
#
# Create the password file first (it is gitignored):
#   mosquitto_passwd -c server/mosquitto.passwd invigil

# Listen on every network interface so the sensor unit can connect.
listener 1883

allow_anonymous false
password_file server/mosquitto.passwd
