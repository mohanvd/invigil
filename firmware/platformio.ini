; Invigil sensor node: ESP32-S3 N16R8 (16 MB quad flash, 8 MB octal PSRAM), ESP-IDF.
; Flash and PSRAM settings are also in sdkconfig.defaults. Keep the two in sync.

[env:node]
platform = espressif32@7.1.3
framework = espidf
board = esp32-s3-devkitc-1
; The stock board file is the 8 MB, no-PSRAM DevKitC. Override for N16R8.
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; PlatformIO builds the partition table from this, not from sdkconfig.
; Must match CONFIG_PARTITION_TABLE_SINGLE_APP_LARGE (1.5 MB app) in sdkconfig.defaults.
board_build.partitions = partitions_singleapp_large.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
